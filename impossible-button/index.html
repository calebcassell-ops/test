<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .button {
      padding: 24px 64px;
      font-size: 32px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
    }

    #startButton {
      background: linear-gradient(145deg, #4ade80, #22c55e);
      color: white;
      box-shadow: 0 8px 32px rgba(74, 222, 128, 0.4);
      transition: none;
    }

    #actuallyStartButton {
      background: linear-gradient(145deg, #60a5fa, #3b82f6);
      color: white;
      box-shadow: 0 8px 32px rgba(96, 165, 250, 0.4);
      display: none;
      font-size: 24px;
      padding: 18px 48px;
    }

    #successScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #successScreen h1 {
      color: white;
      font-size: 48px;
    }

    #successScreen p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="startButton" class="button">START</button>
  <button id="actuallyStartButton" class="button">ACTUALLY START</button>

  <div id="successScreen">
    <h1>Congratulations!</h1>
    <p>CONTINUAL LEARNING SOLVED</p>
  </div>

  <script>
    const startButton = document.getElementById('startButton');
    const actuallyStartButton = document.getElementById('actuallyStartButton');
    const successScreen = document.getElementById('successScreen');

    let escapeCount = 0;
    const escapeThreshold = 10;
    let phase = 1; // 1 = running button only, 2 = both buttons

    let buttonX, buttonY;
    let targetX, targetY;
    let isRunning = false;
    let mouseX = 0, mouseY = 0;

    // Center the start button initially
    function centerButton(btn) {
      const x = window.innerWidth / 2 - btn.offsetWidth / 2;
      const y = window.innerHeight / 2 - btn.offsetHeight / 2;
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      return { x, y };
    }

    const initialPos = centerButton(startButton);
    buttonX = initialPos.x;
    buttonY = initialPos.y;
    targetX = buttonX;
    targetY = buttonY;

    // Track mouse position
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      if (phase === 2) {
        updateVoidMask(e);
      }
    });

    // Animation loop for smooth button movement (runs in both phases)
    function animateButton() {
      if (phase === 3) {
        requestAnimationFrame(animateButton);
        return;
      }

      const btnRect = startButton.getBoundingClientRect();
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;

      const distToMouse = Math.hypot(btnCenterX - mouseX, btnCenterY - mouseY);
      const runThreshold = 120;

      // If mouse is close, pick a new target to run to
      if (distToMouse < runThreshold && !isRunning) {
        isRunning = true;

        if (phase === 1) {
          escapeCount++;
        }

        const padding = 100;
        const maxX = window.innerWidth - startButton.offsetWidth - padding;
        const maxY = window.innerHeight - startButton.offsetHeight - padding;

        // Run away from the mouse
        const angle = Math.atan2(btnCenterY - mouseY, btnCenterX - mouseX);
        const runDistance = 200 + Math.random() * 150;

        let newX = buttonX + Math.cos(angle) * runDistance;
        let newY = buttonY + Math.sin(angle) * runDistance;

        // Add some randomness to the angle
        newX += (Math.random() - 0.5) * 100;
        newY += (Math.random() - 0.5) * 100;

        // Clamp to screen
        targetX = Math.max(padding, Math.min(maxX, newX));
        targetY = Math.max(padding, Math.min(maxY, newY));

        // Check for phase transition
        if (escapeCount >= escapeThreshold && phase === 1) {
          setTimeout(() => {
            phase = 2;
            actuallyStartButton.style.display = 'block';
            centerButton(actuallyStartButton);
          }, 300);
        }
      }

      // Smooth movement towards target
      const speed = 0.15;
      buttonX += (targetX - buttonX) * speed;
      buttonY += (targetY - buttonY) * speed;

      startButton.style.left = buttonX + 'px';
      startButton.style.top = buttonY + 'px';

      // Check if we've arrived at target
      if (Math.hypot(targetX - buttonX, targetY - buttonY) < 1) {
        isRunning = false;
      }

      requestAnimationFrame(animateButton);
    }

    animateButton();

    // Make start button actually clickable (if they somehow get it)
    startButton.addEventListener('click', () => {
      win();
    });

    // Phase 2: Void around cursor - circular hole follows mouse
    const voidRadius = 30;

    function updateVoidMask(e) {
      const btnRect = actuallyStartButton.getBoundingClientRect();

      // Calculate mouse position relative to button
      const relX = e.clientX - btnRect.left;
      const relY = e.clientY - btnRect.top;

      // Create a mask with a circular hole where the cursor is
      // Transparent circle at cursor, opaque everywhere else
      const mask = `radial-gradient(circle ${voidRadius}px at ${relX}px ${relY}px, transparent 0%, transparent ${voidRadius}px, black ${voidRadius}px)`;
      actuallyStartButton.style.webkitMaskImage = mask;
      actuallyStartButton.style.maskImage = mask;
    }

    // Easter egg: keyboard shortcut to win
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        win();
      }
    });

    // The second button is never clickable
    actuallyStartButton.style.pointerEvents = 'none';

    function win() {
      phase = 3;
      startButton.style.display = 'none';
      actuallyStartButton.style.display = 'none';
      successScreen.style.display = 'flex';

      // Confetti celebration
      for (let i = 0; i < 100; i++) {
        createConfetti();
      }
    }

    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.top = -10 + 'px';
      confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(confetti);

      const duration = 2000 + Math.random() * 2000;
      const xDrift = (Math.random() - 0.5) * 200;

      confetti.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${window.innerHeight + 20}px) translateX(${xDrift}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      }).onfinish = () => confetti.remove();
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      if (phase === 1 || phase === 2) {
        const pos = centerButton(startButton);
        buttonX = pos.x;
        buttonY = pos.y;
        targetX = buttonX;
        targetY = buttonY;
      }
      if (phase === 2) centerButton(actuallyStartButton);
    });
  </script>
</body>
</html>
