<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .button {
      padding: 24px 64px;
      font-size: 32px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      user-select: none;
    }

    .start-button {
      background: linear-gradient(145deg, #4ade80, #22c55e);
      color: white;
      box-shadow: 0 8px 32px rgba(74, 222, 128, 0.4);
      transition: none;
      pointer-events: none;
    }

    #actuallyStartButton {
      background: linear-gradient(145deg, #60a5fa, #3b82f6);
      color: white;
      box-shadow: 0 8px 32px rgba(96, 165, 250, 0.4);
      display: none;
      font-size: 24px;
      padding: 18px 48px;
      pointer-events: none;
    }

    #derivativeButton {
      background: linear-gradient(145deg, #f472b6, #ec4899);
      color: white;
      box-shadow: 0 8px 32px rgba(244, 114, 182, 0.4);
      display: none;
      font-size: 20px;
      padding: 16px 32px;
    }

    #enjoyingButton {
      background: linear-gradient(145deg, #fbbf24, #f59e0b);
      color: white;
      box-shadow: 0 8px 32px rgba(251, 191, 36, 0.4);
      display: none;
      font-size: 20px;
      padding: 16px 32px;
    }

    #successScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #successScreen h1 {
      color: white;
      font-size: 48px;
    }

    #successScreen p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
    }

    #pdfIcon {
      display: none;
      position: absolute;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    #pdfIcon .icon {
      width: 80px;
      height: 100px;
      background: linear-gradient(145deg, #ef4444, #dc2626);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }

    #pdfIcon .filename {
      color: white;
      font-size: 12px;
      max-width: 150px;
      text-align: center;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <button id="startButton" class="button start-button">START</button>
  <button id="actuallyStartButton" class="button">ACTUALLY START</button>
  <button id="derivativeButton" class="button">THIS IS DERIVATIVE</button>
  <button id="enjoyingButton" class="button">I'M ENJOYING THIS</button>

  <div id="pdfIcon">
    <div class="icon">PDF</div>
    <div class="filename">ANovelApproachToContinualLearning.pdf</div>
  </div>

  <div id="successScreen">
    <h1>Congratulations!</h1>
    <p>CONTINUAL LEARNING SOLVED</p>
  </div>

  <script>
    const startButton = document.getElementById('startButton');
    const actuallyStartButton = document.getElementById('actuallyStartButton');
    const derivativeButton = document.getElementById('derivativeButton');
    const enjoyingButton = document.getElementById('enjoyingButton');
    const pdfIcon = document.getElementById('pdfIcon');
    const successScreen = document.getElementById('successScreen');

    let escapeCount = 0;
    const escapeThreshold = 10;
    let phase = 1; // 1 = running button only, 2 = void button, 3 = choice buttons, 4 = pong mode
    let actuallyStartClickCount = 0;
    const actuallyStartClickThreshold = 5;

    let buttonX, buttonY;
    let targetX, targetY;
    let isRunning = false;
    let mouseX = 0, mouseY = 0;

    // Bouncing buttons state
    let bouncingButtons = [];

    // Center a button
    function centerButton(btn) {
      const x = window.innerWidth / 2 - btn.offsetWidth / 2;
      const y = window.innerHeight / 2 - btn.offsetHeight / 2;
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      return { x, y };
    }

    const initialPos = centerButton(startButton);
    buttonX = initialPos.x;
    buttonY = initialPos.y;
    targetX = buttonX;
    targetY = buttonY;

    // Track mouse position
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      if (phase === 2) {
        updateVoidMask(e);
      }
    });

    // Track clicks on ACTUALLY START area
    document.addEventListener('click', (e) => {
      if (phase === 2) {
        const btnRect = actuallyStartButton.getBoundingClientRect();
        if (e.clientX >= btnRect.left && e.clientX <= btnRect.right &&
            e.clientY >= btnRect.top && e.clientY <= btnRect.bottom) {
          actuallyStartClickCount++;

          if (actuallyStartClickCount >= actuallyStartClickThreshold) {
            showChoiceButtons();
          }
        }
      }
    });

    function showChoiceButtons() {
      phase = 3;

      // Position choice buttons
      derivativeButton.style.display = 'block';
      enjoyingButton.style.display = 'block';

      const centerY = window.innerHeight / 2 - 30;
      derivativeButton.style.left = (window.innerWidth / 2 - derivativeButton.offsetWidth - 20) + 'px';
      derivativeButton.style.top = centerY + 'px';

      enjoyingButton.style.left = (window.innerWidth / 2 + 20) + 'px';
      enjoyingButton.style.top = centerY + 'px';
    }

    // Animation loop for smooth button movement
    function animateButton() {
      if (phase >= 3 && bouncingButtons.length === 0) {
        requestAnimationFrame(animateButton);
        return;
      }

      // Animate the original start button (phases 1-2)
      if (phase === 1 || phase === 2) {
        const btnRect = startButton.getBoundingClientRect();
        const btnCenterX = btnRect.left + btnRect.width / 2;
        const btnCenterY = btnRect.top + btnRect.height / 2;

        const distToMouse = Math.hypot(btnCenterX - mouseX, btnCenterY - mouseY);
        const runThreshold = 120;

        if (distToMouse < runThreshold && !isRunning) {
          isRunning = true;

          if (phase === 1) {
            escapeCount++;
          }

          const padding = 100;
          const maxX = window.innerWidth - startButton.offsetWidth - padding;
          const maxY = window.innerHeight - startButton.offsetHeight - padding;

          const angle = Math.atan2(btnCenterY - mouseY, btnCenterX - mouseX);
          const runDistance = 200 + Math.random() * 150;

          let newX = buttonX + Math.cos(angle) * runDistance;
          let newY = buttonY + Math.sin(angle) * runDistance;

          newX += (Math.random() - 0.5) * 100;
          newY += (Math.random() - 0.5) * 100;

          targetX = Math.max(padding, Math.min(maxX, newX));
          targetY = Math.max(padding, Math.min(maxY, newY));

          if (escapeCount >= escapeThreshold && phase === 1) {
            setTimeout(() => {
              phase = 2;
              actuallyStartButton.style.display = 'block';
              centerButton(actuallyStartButton);
            }, 300);
          }
        }

        const speed = 0.15;
        buttonX += (targetX - buttonX) * speed;
        buttonY += (targetY - buttonY) * speed;

        startButton.style.left = buttonX + 'px';
        startButton.style.top = buttonY + 'px';

        if (Math.hypot(targetX - buttonX, targetY - buttonY) < 1) {
          isRunning = false;
        }
      }

      // Animate bouncing buttons (phase 4)
      if (phase === 4 && bouncingButtons.length > 0) {
        animateBouncingButtons();
      }

      requestAnimationFrame(animateButton);
    }

    animateButton();

    // Phase 2: Void around cursor
    const voidRadius = 30;

    function updateVoidMask(e) {
      const btnRect = actuallyStartButton.getBoundingClientRect();
      const relX = e.clientX - btnRect.left;
      const relY = e.clientY - btnRect.top;

      const mask = `radial-gradient(circle ${voidRadius}px at ${relX}px ${relY}px, transparent 0%, transparent ${voidRadius}px, black ${voidRadius}px)`;
      actuallyStartButton.style.webkitMaskImage = mask;
      actuallyStartButton.style.maskImage = mask;
    }

    // THIS IS DERIVATIVE - show PDF icon
    derivativeButton.addEventListener('click', () => {
      pdfIcon.style.display = 'flex';
      pdfIcon.style.left = (window.innerWidth / 2 - 75) + 'px';
      pdfIcon.style.top = (window.innerHeight / 2 + 80) + 'px';
    });

    // I'M ENJOYING THIS - spawn bouncing buttons
    enjoyingButton.addEventListener('click', () => {
      phase = 4;

      // Hide other elements
      startButton.style.display = 'none';
      actuallyStartButton.style.display = 'none';
      derivativeButton.style.display = 'none';
      enjoyingButton.style.display = 'none';
      pdfIcon.style.display = 'none';

      // Create 10 bouncing buttons
      for (let i = 0; i < 10; i++) {
        createBouncingButton(i);
      }
    });

    function createBouncingButton(index) {
      const btn = document.createElement('button');
      btn.className = 'button start-button';
      btn.textContent = 'START';
      btn.style.pointerEvents = 'none';
      document.body.appendChild(btn);

      const padding = 100;
      const x = padding + Math.random() * (window.innerWidth - btn.offsetWidth - padding * 2);
      const y = padding + Math.random() * (window.innerHeight - btn.offsetHeight - padding * 2);

      btn.style.left = x + 'px';
      btn.style.top = y + 'px';

      // Random initial velocity
      const speed = 3 + Math.random() * 3;
      const angle = Math.random() * Math.PI * 2;

      bouncingButtons.push({
        element: btn,
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        width: btn.offsetWidth,
        height: btn.offsetHeight
      });
    }

    function animateBouncingButtons() {
      const padding = 20;

      // Update positions
      for (const btn of bouncingButtons) {
        btn.x += btn.vx;
        btn.y += btn.vy;

        // Wall collisions
        if (btn.x <= padding) {
          btn.x = padding;
          btn.vx = Math.abs(btn.vx);
        }
        if (btn.x + btn.width >= window.innerWidth - padding) {
          btn.x = window.innerWidth - padding - btn.width;
          btn.vx = -Math.abs(btn.vx);
        }
        if (btn.y <= padding) {
          btn.y = padding;
          btn.vy = Math.abs(btn.vy);
        }
        if (btn.y + btn.height >= window.innerHeight - padding) {
          btn.y = window.innerHeight - padding - btn.height;
          btn.vy = -Math.abs(btn.vy);
        }
      }

      // Button-to-button collisions (Pong-style)
      for (let i = 0; i < bouncingButtons.length; i++) {
        for (let j = i + 1; j < bouncingButtons.length; j++) {
          const a = bouncingButtons[i];
          const b = bouncingButtons[j];

          // Check AABB collision
          if (a.x < b.x + b.width && a.x + a.width > b.x &&
              a.y < b.y + b.height && a.y + a.height > b.y) {

            // Calculate centers
            const aCenterX = a.x + a.width / 2;
            const aCenterY = a.y + a.height / 2;
            const bCenterX = b.x + b.width / 2;
            const bCenterY = b.y + b.height / 2;

            // Determine collision axis
            const overlapX = (a.width + b.width) / 2 - Math.abs(aCenterX - bCenterX);
            const overlapY = (a.height + b.height) / 2 - Math.abs(aCenterY - bCenterY);

            if (overlapX < overlapY) {
              // Horizontal collision - swap X velocities
              const tempVx = a.vx;
              a.vx = b.vx;
              b.vx = tempVx;

              // Separate
              if (aCenterX < bCenterX) {
                a.x -= overlapX / 2;
                b.x += overlapX / 2;
              } else {
                a.x += overlapX / 2;
                b.x -= overlapX / 2;
              }
            } else {
              // Vertical collision - swap Y velocities
              const tempVy = a.vy;
              a.vy = b.vy;
              b.vy = tempVy;

              // Separate
              if (aCenterY < bCenterY) {
                a.y -= overlapY / 2;
                b.y += overlapY / 2;
              } else {
                a.y += overlapY / 2;
                b.y -= overlapY / 2;
              }
            }
          }
        }
      }

      // Apply positions
      for (const btn of bouncingButtons) {
        btn.element.style.left = btn.x + 'px';
        btn.element.style.top = btn.y + 'px';
      }
    }

    // Easter egg: keyboard shortcut to win
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        win();
      }
    });

    function win() {
      phase = 5;
      startButton.style.display = 'none';
      actuallyStartButton.style.display = 'none';
      derivativeButton.style.display = 'none';
      enjoyingButton.style.display = 'none';
      pdfIcon.style.display = 'none';

      // Remove bouncing buttons
      for (const btn of bouncingButtons) {
        btn.element.remove();
      }
      bouncingButtons = [];

      successScreen.style.display = 'flex';

      for (let i = 0; i < 100; i++) {
        createConfetti();
      }
    }

    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.top = -10 + 'px';
      confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(confetti);

      const duration = 2000 + Math.random() * 2000;
      const xDrift = (Math.random() - 0.5) * 200;

      confetti.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${window.innerHeight + 20}px) translateX(${xDrift}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      }).onfinish = () => confetti.remove();
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      if (phase === 1 || phase === 2) {
        const pos = centerButton(startButton);
        buttonX = pos.x;
        buttonY = pos.y;
        targetX = buttonX;
        targetY = buttonY;
      }
      if (phase === 2) centerButton(actuallyStartButton);
    });
  </script>
</body>
</html>
